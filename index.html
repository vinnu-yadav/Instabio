<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinnu Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:black;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.box{
    width:320px;
    padding:20px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:white;
    cursor:pointer;

    background:rgba(0,255,120,0.18);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(0,255,120,0.4);
    border-radius:20%;

    box-shadow:0 0 20px rgba(0,255,120,0.4);

    transition:0.3s;
}

.box:hover{
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(0,255,120,0.8);
}

.owner{
    margin-top:10px;
    color:#00ff88;
    font-size:18px;
    text-shadow:0 0 10px #00ff88;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">

    <div class="box"
         onclick="window.location.href='https://www.instagram.com/_vinnu___yadav_?igsh=MTE5cmcyM3BxNjgweA=='">
        Follow on Insta
    </div>

    <div class="box"
         onclick="window.location.href='https://www.instagram.com/_vinnu___yadav_?igsh=MTE5cmcyM3BxNjgweA=='">
        Order a Website as Your Wish
    </div>

    <div class="owner">
        Owner: Vinnu ©
    </div>

</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*(){}[]<>/?";
const letters = chars.split("");

const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
    drops[x] = 1;
}

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++){

        const text =
        letters[Math.floor(Math.random() * letters.length)];

        ctx.fillText(
            text,
            i * fontSize,
            drops[i] * fontSize
        );

        if(
            drops[i] * fontSize > canvas.height &&
            Math.random() > 0.975
        ){
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(draw, 35);

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
